global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'router'
    static_configs:
      - targets: ['router:8000']
    metrics_path: '/metrics'

  - job_name: 'provider-01'
    static_configs:
      - targets: ['provider-01:8001']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
